version: 2

config:
  parameter_defaults:
    EARTHMOVER_NODE_TO_RESOLVE: "$sources.input"
  # The clean_observables macro below takes the OBSERVABLES set in each bundle and cleans them for use downstream.
  # OBSERVABLE_FIRST_NAME and OBSERVABLE_LAST_NAME are passed to the macro as strings because we conditionally populate these
  # using either OBSERVABLE_FULL_NAME or OBSERVABLE_FIRST_NAME/OBSERVABLE_LAST_NAME, depending on which is provided.
  # All other observables are passed as variable references.
  macros: >
    {%- macro clean_observables(obs) -%}

      {%- set observables = {
          'OBSERVABLE_BIRTH_DATE': ${OBSERVABLE_BIRTH_DATE},
          'OBSERVABLE_SCHOOL_ID': ${OBSERVABLE_SCHOOL_ID},
          'OBSERVABLE_STUDENT_IDS': ${OBSERVABLE_STUDENT_IDS}
      } -%}
  
      {%- if obs in ['OBSERVABLE_FIRST_NAME', 'OBSERVABLE_LAST_NAME'] -%}
        {%- set full_name = __row_data__['${OBSERVABLE_FULL_NAME}'] -%}
        {%- if full_name-%}
          {%- if ',' in full_name -%}
            {%- set first_name = full_name.split(',')[1].split(' ')[0] -%}
            {%- set last_name = full_name.split(',')[0] -%}
          {%- else -%}
            {%- set first_name = full_name.split(' ')[0] -%}
            {%- set last_name = full_name.split(' ')[full_name|length -1] -%}
          {%- endif -%}
        {%- else -%}
          {%- set first_name = __row_data__['${OBSERVABLE_FIRST_NAME}'] -%}
          {%- set last_name = __row_data__['${OBSERVABLE_LAST_NAME}'] -%}
        {% endif %}
        {%- if obs == 'OBSERVABLE_FIRST_NAME' -%} {{first_name | trim | lower | default(none, true)}}
        {%- else -%} {{last_name | trim | lower | default(none, true)}}
        {%- endif -%}
      {%- elif obs in ['OBSERVABLE_SCHOOL_ID', 'OBSERVABLE_STUDENT_IDS'] -%} 
        {%- set base_list = observables[obs] -%}
        {%- set cleaned_list = [] -%}
        {%- for item in base_list -%}
          {%- set _ = cleaned_list.append(__row_data__[item] | trim | lower | default(none, true)) -%}
        {%-endfor-%}
        {%- if cleaned_list | reject('none') | list | length == 0 -%} {{[]}}
        {%- else -%}{{cleaned_list}}
        {%-endif-%}
      {%- else -%}{{ observables[obs] | trim | lower | default(none, true) }}
      {%- endif -%}
    {%- endmacro %} 

transformations:

  # Create the candidate id. Hash all available observables associated with each student record.
  # The candidate ID column is appended to the input dataframe, and passed down to subsequent operations.
  input_with_candidates:
    source: ${EARTHMOVER_NODE_TO_RESOLVE}
    operations:
      - operation: add_columns
        columns:
          obs_first_name: "{%raw%}{{clean_observables('OBSERVABLE_FIRST_NAME')}}{%endraw%}"
          obs_last_name: "{%raw%}{{clean_observables('OBSERVABLE_LAST_NAME')}}{%endraw%}"
          obs_birth_date: "{%raw%}{{clean_observables('OBSERVABLE_BIRTH_DATE')}}{%endraw%}"
          obs_school_id: "{%raw%}{{clean_observables('OBSERVABLE_SCHOOL_ID')}}{%endraw%}"
          obs_student_ids: "{%raw%}{{clean_observables('OBSERVABLE_STUDENT_IDS')}}{%endraw%}"
      - operation: combine_columns
        columns:
          - obs_first_name
          - obs_last_name
          - obs_birth_date
          - obs_school_id
          - obs_student_ids
        new_column: __candidate_id
        separator: '|'
      - operation: modify_columns
        columns:
          __candidate_id: "{%raw%}{{md5(__candidate_id)}}{%endraw%}"
      - operation: add_columns
        columns:
          edFi_studentUniqueID: "{%raw%}CANDIDATE_{{__candidate_id}}{%endraw%}"

  # Create a Candidate <-> row crosswalk. 
  # NOTE: This is not run at present. 
  # May be resolved with additional earthmover functionality, resulting in a new implementation in this script. 
  # input_numbered:
  #   source: $transformations.input_with_candidates
  #   operations:
  #     - operation: add_columns
  #       columns:
  #         __all_rows: '1'
  #     - operation: group_by_with_rank
  #       group_by_columns: [__all_rows]
  #       rank_column: rank_column

  # Summarize candidate counts by candidate ID and observables
  candidates:
    source: $transformations.input_with_candidates
    operations:
      - operation: group_by
        group_by_columns:
        - __candidate_id
        - obs_first_name
        - obs_last_name
        - obs_birth_date
        - obs_school_id
        - obs_student_ids
        create_columns:
          record_count: count()

destinations:
  # input_records:
  #   source: $transformations.input_numbered
  #   template: ./templates/input_records.jsont
  #   extension: jsonl
  candidates:
    source: $transformations.candidates
    template: ./templates/candidates.jsont
    extension: jsonl