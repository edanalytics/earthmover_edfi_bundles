version: 2

config:
  parameter_defaults:
    EARTHMOVER_NODE_TO_RESOLVE: "$sources.input"
    STUDENT_ASSESSMENTS_NODE: "$transformations.student_assessments"
    OBSERVABLE_BIRTH_DATE_FORMAT: ""
    STUDENT_UNIQUE_ID_IN_STUDENT_ASSESSMENT_IDENTIFIER: false
    HASH_APPLIED: false

  # Two macros are used to clean certain types of observables.
  # clean_single_observable handles single observable inputs. It simply trims inputs and falls back to an empty string if the input is null.
  # clean_list applies standard transformations to all list inputs, returning a new list with each item trimmed and nulls interpolated for empty inputs.
  macros: >
    {%- macro clean_single_observable(obs) -%}
      {{ obs | default('', true) | trim }}
    {%- endmacro %} 

    {%- macro clean_list(base_list, __row_data__) -%}
      {%- set cleaned_list = [] -%}
      {%- for item in base_list -%}
      {%- set _ = cleaned_list.append(__row_data__[item] | trim | default(none, true)) -%}
      {%- endfor -%}
      {%- if cleaned_list | reject('none') | list | length == 0 -%} {{[]}}
      {%- else -%}{{cleaned_list | tojson}}
      {%-endif-%}
    {%- endmacro %} 


transformations:

  # Create the candidate id. Hash all available observables associated with each student record.
  # The candidate ID column is appended to the input dataframe, and passed down to subsequent operations.
  input_with_candidates:
    source: ${EARTHMOVER_NODE_TO_RESOLVE}
    operations:
      - operation: add_columns
        columns:
          obs_first_name: "{%raw%}{{clean_single_observable(__row_data__['$OBSERVABLE_FIRST_NAME'])}}{%endraw%}"
          obs_last_name: "{%raw%}{{clean_single_observable(__row_data__['$OBSERVABLE_LAST_NAME'])}}{%endraw%}"
          obs_full_name: "{%raw%}{{clean_single_observable(__row_data__['$OBSERVABLE_FULL_NAME'])}}{%endraw%}"
          obs_birth_date: "{%raw%}{{clean_single_observable(__row_data__['$OBSERVABLE_BIRTH_DATE'])}}{%endraw%}"
          obs_school_ids: "{%raw%}{{clean_list($OBSERVABLE_SCHOOL_IDS, __row_data__)}}{%endraw%}"
          obs_student_ids: "{%raw%}{{clean_list($OBSERVABLE_STUDENT_IDS, __row_data__)}}{%endraw%}"
      # Note that list columns are JSON-encoded (Matching python json.dumps default), meaning that the candidate id hash is tied to a properly JSON formatted, unsorted list.
      - operation: combine_columns
        columns:
          - obs_first_name
          - obs_last_name
          - obs_full_name
          - obs_birth_date
          - obs_school_ids
          - obs_student_ids
        new_column: __candidate_id
        separator: '|'
      - operation: modify_columns
        columns:
          __candidate_id: "{%raw%}{{md5(__candidate_id)}}{%endraw%}"
      - operation: add_columns
        columns:
          edFi_studentUniqueID: "{%raw%}CANDIDATE_{{__candidate_id}}{%endraw%}"

  # Create a Candidate <-> row crosswalk. 
  # NOTE: This is not run at present. 
  # May be resolved with additional earthmover functionality, resulting in a new implementation in this script. 
  # input_numbered:
  #   source: $transformations.input_with_candidates
  #   operations:
  #     - operation: add_columns
  #       columns:
  #         __all_rows: '1'
  #     - operation: group_by_with_rank
  #       group_by_columns: [__all_rows]
  #       rank_column: rank_column

  # Summarize candidate counts by candidate ID and observables
  candidates:
    source: $transformations.input_with_candidates
    operations:
      - operation: group_by
        group_by_columns:
        - __candidate_id
        - obs_first_name
        - obs_last_name
        - obs_full_name
        - obs_birth_date
        - obs_school_ids
        - obs_student_ids
        create_columns:
          record_count: count()
      - operation: add_columns
        columns:
          obs_birth_date_format: "{%raw%}${OBSERVABLE_BIRTH_DATE_FORMAT}{%endraw%}"

  student_assessment_identifier_lookup:
    source: ${STUDENT_ASSESSMENTS_NODE}
    operations:
      - operation: add_columns
        columns:
          student_unique_id_in_student_assessment_identifier: "{%raw%}${STUDENT_UNIQUE_ID_IN_STUDENT_ASSESSMENT_IDENTIFIER}{%endraw%}"
          hash_applied: "{%raw%}${HASH_APPLIED}{%endraw%}"
          substitution: "{%raw%}{%if substitution_studentAssessmentIdentifier %}{{substitution_studentAssessmentIdentifier}}{%else%}{%endif%}{%endraw%}"
      - operation: keep_columns
        columns:
        - studentAssessmentIdentifier
        - substitution
        - student_unique_id_in_student_assessment_identifier
        - hash_applied

destinations:
  student_assessment_identifier_lookup:
    source: $transformations.student_assessment_identifier_lookup
    template: ./templates/student_assessment_identifier_lookup.jsont
    extension: jsonl
  candidates:
    source: $transformations.candidates
    template: ./templates/candidates.jsont
    extension: jsonl