version: 2

config:
  parameter_defaults:
    EARTHMOVER_NODE_TO_RESOLVE: "$sources.input"
  # Two macros are used to clean certain types of observables. In order to apply these macros to new fields, make sure to update the 'obs' dict in the relevant macro.
  # clean_names handles name inputs. If FULL_NAME is set, it tries to extract the first and last from the FULL_NAME field. If not, it cleans the FIRST_NAME and LAST_NAME fields.
  # clean_list applies standard transformations to all list inputs, returning a new list with each item cleaned.
  macros: >
    {%- macro clean_names(obs) -%}
      {%- set name_obs = {
          'OBSERVABLE_FULL_NAME': '${OBSERVABLE_FULL_NAME}',
          'OBSERVABLE_FIRST_NAME': '${OBSERVABLE_FIRST_NAME}',
          'OBSERVABLE_LAST_NAME': '${OBSERVABLE_LAST_NAME}',       
      } -%}
      
      {%- if __row_data__[name_obs['OBSERVABLE_FULL_NAME']] -%}
        {%- set full_name = __row_data__[name_obs['OBSERVABLE_FULL_NAME']] | trim -%}
        {%- if ',' in full_name -%}
          {%- set first_name = full_name.split(',')[1].strip().split(' ')[0] -%}
          {%- set last_name = full_name.split(',')[0] -%}
        {%- else -%}
          {%- set first_name = full_name.split(' ')[0] -%}
          {%- set last_name = full_name.split(' ')[-1] -%}
        {%- endif -%}
      {%- endif -%}

      {%- if first_name or last_name -%}
        {{(first_name if obs == 'OBSERVABLE_FIRST_NAME' else last_name) | default('', true) | trim}}
      {%- else -%}
        {{__row_data__[name_obs[obs]] | default('', true) | trim }}
      {%- endif -%}
    {%- endmacro %} 

    {%- macro clean_list(obs) -%}
      {%- set list_obs = {
          'OBSERVABLE_SCHOOL_IDS': ${OBSERVABLE_SCHOOL_IDS},
          'OBSERVABLE_STUDENT_IDS': ${OBSERVABLE_STUDENT_IDS}
      } -%}

      {%- set base_list = list_obs[obs] -%}
      {%- set cleaned_list = [] -%}
      {%- for item in base_list -%}
        {%- set _ = cleaned_list.append(__row_data__[item] | trim | default(none, true)) -%}
      {%-endfor-%}
      {%- if cleaned_list | reject('none') | list | length == 0 -%} {{[]}}
      {%- else -%}{{cleaned_list | tojson}}
      {%-endif-%}
    {%- endmacro %} 

transformations:

  # Create the candidate id. Hash all available observables associated with each student record.
  # The candidate ID column is appended to the input dataframe, and passed down to subsequent operations.
  input_with_candidates:
    source: ${EARTHMOVER_NODE_TO_RESOLVE}
    operations:
      - operation: add_columns
        columns:
          obs_first_name: "{%raw%}{{clean_names('OBSERVABLE_FIRST_NAME')}}{%endraw%}"
          obs_last_name: "{%raw%}{{clean_names('OBSERVABLE_LAST_NAME')}}{%endraw%}"
          obs_birth_date: "{%raw%}{{__row_data__['$OBSERVABLE_BIRTH_DATE']}}{%endraw%}"
          obs_school_ids: "{%raw%}{{clean_list('OBSERVABLE_SCHOOL_IDS')}}{%endraw%}"
          obs_student_ids: "{%raw%}{{clean_list('OBSERVABLE_STUDENT_IDS')}}{%endraw%}"
      - operation: combine_columns
        columns:
          - obs_first_name
          - obs_last_name
          - obs_birth_date
          - obs_school_ids
          - obs_student_ids
        new_column: __candidate_id
        separator: '|'
      - operation: modify_columns
        columns:
          __candidate_id: "{%raw%}{{md5(__candidate_id)}}{%endraw%}"
      - operation: add_columns
        columns:
          edFi_studentUniqueID: "{%raw%}CANDIDATE_{{__candidate_id}}{%endraw%}"

  # Create a Candidate <-> row crosswalk. 
  # NOTE: This is not run at present. 
  # May be resolved with additional earthmover functionality, resulting in a new implementation in this script. 
  # input_numbered:
  #   source: $transformations.input_with_candidates
  #   operations:
  #     - operation: add_columns
  #       columns:
  #         __all_rows: '1'
  #     - operation: group_by_with_rank
  #       group_by_columns: [__all_rows]
  #       rank_column: rank_column

  # Summarize candidate counts by candidate ID and observables
  candidates:
    source: $transformations.input_with_candidates
    operations:
      - operation: group_by
        group_by_columns:
        - __candidate_id
        - obs_first_name
        - obs_last_name
        - obs_birth_date
        - obs_school_ids
        - obs_student_ids
        create_columns:
          record_count: count()

destinations:
  # input_records:
  #   source: $transformations.input_numbered
  #   template: ./templates/input_records.jsont
  #   extension: jsonl
  candidates:
    source: $transformations.candidates
    template: ./templates/candidates.jsont
    extension: jsonl