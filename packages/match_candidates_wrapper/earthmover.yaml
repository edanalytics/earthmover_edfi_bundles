version: 2

config:
  output_dir: ${OUTPUT_DIR}
  log_level: INFO
  show_stacktrace: True
  show_graph: False
  parameter_defaults:
    OUTPUT_DIR: output
    ASSESSMENT_BUNDLE_BRANCH: main

packages:
  {#
    DO NOT CHANGE the order of these packages - this would change which
    takes precedence over which, and could break some bundles.
  #}
  ${ASSESSMENT_BUNDLE}:
    git: https://github.com/edanalytics/earthmover_edfi_bundles.git
    branch: ${ASSESSMENT_BUNDLE_BRANCH}
    subdirectory: assessments/${ASSESSMENT_BUNDLE}
  match_candidates:
    git: https://github.com/edanalytics/earthmover_edfi_bundles.git
    branch: main
    subdirectory: packages/match_candidates

transformations:
  input:
    source: $transformations.input_with_candidates

