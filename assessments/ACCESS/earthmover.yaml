version: 2

config:
  log_level: INFO
  output_dir: ${OUTPUT_DIR} # this will be a parameter that is passed through from the command line, leave this as-is
  memory_limit: 1GB
  state_file: ${STATE_FILE}
  tmp_dir: ${TMP_DIR}
  show_graph: False
  parameter_defaults:
    OUTPUT_DIR: ./output
    TMP_DIR: /tmp
    STATE_FILE: ./runs.csv
    STUDENT_ID_NAME: 'edFi_studentUniqueID' # default to the column added by the apply_xwalk package of student ID xwalking feature
    POSSIBLE_STUDENT_ID_COLUMNS: 'UniqueDRCStudentID,StateStudentID,DistrictStudentID'
    FORMAT: 'Standard'
    DESCRIPTOR_NAMESPACE: uri://ed-fi.org

    OBSERVABLE_FIRST_NAME: 'StudentFirstName'
    OBSERVABLE_LAST_NAME: 'StudentLastName'
    OBSERVABLE_BIRTH_DATE: 'BirthDate'
    OBSERVABLE_SCHOOL_IDS: ['SchoolNumber']
    OBSERVABLE_STUDENT_IDS: ['UniqueDRCStudentID','StateStudentID','DistrictStudentID']

sources:
  input:
    file: ${INPUT_FILE}
    header_rows: 1
  academicSubjectDescriptors:
    file: ./seeds/academicSubjectDescriptors.csv
    header_rows: 1
  accommodationDescriptors:
    file: ./seeds/accommodationDescriptors.csv
    header_rows: 1
  administrationEnvironmentDescriptors:
    file: ./seeds/administrationEnvironmentDescriptors.csv
    header_rows: 1
  assessments:
    file: ./seeds/assessments.csv
    header_rows: 1
  assessmentCategoryDescriptors:
    file: ./seeds/assessmentCategoryDescriptors.csv
    header_rows: 1
  assessmentReportingMethodDescriptors:
    file: ./seeds/assessmentReportingMethodDescriptors.csv
    header_rows: 1
  performanceLevelDescriptors:
    file: ./seeds/performanceLevelDescriptors.csv
    header_rows: 1
  reasonNotTestedDescriptors:
    file: ./seeds/reasonNotTestedDescriptors.csv
    header_rows: 1
  objectiveAssessments:
    file: ./seeds/objectiveAssessments.csv
    header_rows: 1
  gradeLevelDescriptors:
    file: ./seeds/gradeLevelDescriptors.csv
    header_rows: 1

transformations:
  input:
    source: $sources.input
    operations: []
  results:
    source: $transformations.input
    operations:
      # Use April 1st of the assessment year for assessments with no date (invalid scores)
      - operation: add_columns
        columns:
          namespace: "uri://wida.wisc.edu/assess/access"
          defaultTestStartDateTime: "${API_YEAR}-04-01 00:00:00"
          school_year: ${API_YEAR}
          alternate_assessment:
            {% if "${FORMAT}" == "Standard" %}
              "N"
            {% else %}
              "Y"
            {% endif %}
          assessment_identifier:
            {% if "${FORMAT}" == "Standard" %}
              "ACCESS"
            {% else %}
              "Alternate-ACCESS"
            {% endif %}
          Test_Dte: administrationDate
        from_format: "%m/%d/%Y"
        to_format: "%Y-%m-%d"
      - operation: modify_columns
        columns:
          Grade: "{%raw%}{{ Grade.zfill(2) if Grade.isdigit() and Grade|length == 1 else Grade }}{%endraw%}"
      - operation: join
        sources:
          - $sources.gradeLevelDescriptors
        join_type: inner
        left_keys: [Grade, assessment_identifier]
        right_keys: [access_grade, assessment_identifier]
      - operation: duplicate_columns
        columns:
          ${STUDENT_ID_NAME}: studentUniqueId
      - operation: snake_case_columns
      - operation: date_format
        column: test_completion_date
        from_format: "%m/%d/%Y"
        to_format: "%Y-%m-%d"
      - operation: duplicate_columns
        columns:
          proficiency_level_comprehension: performance_level_comprehension
          proficiency_level_literacy: performance_level_literacy
          proficiency_level_oral: performance_level_oral
          proficiency_level_overall: performance_level_overall

  grade_level_descriptors:
    source: $sources.gradeLevelDescriptors
    operations:
      - operation: add_columns
        columns:
          grade_json: >
            {%raw-%}
            {
              "gradeLevelDescriptor": "{{edfi_descriptor}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{grade_json | replace('\n', '')-}}{%endraw%}"
      # group and aggregate:
      - operation: group_by
        group_by_columns:
          - assessment_identifier
        create_columns:
          grade_json: agg(grade_json,)
      # there will be a trailing comma, want to get rid of that
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  academic_subject_descriptors:
    source: $sources.academicSubjectDescriptors
    operations:
      - operation: add_columns
        columns:
          subject_json: >
            {%raw-%}
            {
              "academicSubjectDescriptor": "{{edfi_descriptor}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          subject_json: "{%raw%}{{subject_json | replace('\n', '')-}}{%endraw%}"
      # group and aggregate:
      - operation: group_by
        group_by_columns:
          - assessmentIdentifier
        create_columns:
          subject_json: agg(subject_json,)
      # there will be a trailing comma, want to get rid of that
      - operation: modify_columns
        columns:
          subject_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  assessments:
    source: $sources.assessments
    operations:
      - operation: join
        sources:
          - $transformations.grade_level_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessment_identifier
      - operation: join
        sources:
          - $transformations.academic_subject_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: join
        sources:
          - $sources.assessmentCategoryDescriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier


destinations:
  assessments:
    source: $transformations.assessments
    template: ./templates/assessments.jsont
    extension: jsonl
  objectiveAssessments:
    source: $sources.objectiveAssessments
    template: ./templates/objectiveAssessments.jsont
    extension: jsonl
  studentAssessments:
    source: $transformations.results
    template: ./templates/test.jsont
    extension: jsonl
  accommodationDescriptors:
    source: $sources.accommodationDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  administrationEnvironmentDescriptors:
    source: $sources.administrationEnvironmentDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  assessmentReportingMethodDescriptors:
    source: $sources.assessmentReportingMethodDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  performanceLevelDescriptors:
    source: $sources.performanceLevelDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  reasonNotTestedDescriptors:
    source: $sources.reasonNotTestedDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
