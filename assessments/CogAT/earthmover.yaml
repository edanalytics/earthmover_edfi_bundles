version: 2


config:
  log_level: INFO
  output_dir: ${OUTPUT_DIR}
  memory_limit: 1GB
  state_file: ${STATE_FILE}
  show_graph: False
  show_stacktrace: true
  parameter_defaults:
    STUDENT_ID_NAME: 'edFi_studentUniqueID' # default to the column added by the apply_xwalk package of student ID xwalking feature
    POSSIBLE_STUDENT_ID_COLUMNS: 'Student_ID,Secondary_Student_ID'
    # need to conform the various inputs we accept first
    EARTHMOVER_NODE_TO_XWALK: '$transformations.input_normalized'
    DESCRIPTOR_NAMESPACE: uri://ed-fi.org 
{% set assessmentIdentifier = "CogAT" %}
{% set namespace = "uri://www.riversideinsights.com/cognitive_abilities_test" %}

{#
  Three versions of the same CogAT export turn up, so this bundle takes all three. Each score
  covers seven subtests (V, Q, N, V+Q, V+N, Q+N, V+Q+N):

    * .txt -- fixed width, all seven values in one field
    * .csv -- one column per subtest: "Standard Age Score (SAS) V", "... VQ"
    * .csv -- one column per score: "Standard_Age_Score_SAS" = "107105117107114114112"

  `input_normalized` puts all three into that last shape, which the rest of the bundle reads.
  It can't check which file it got -- Earthmover picks its branches before it sees any
  columns -- so it matches each field with a pattern that fits all three spellings.
#}

{% set raw_tests = ["verbal", "quantitative", "nonverbal"] %}
{% set all_tests = ["verbal", "quantitative", "nonverbal", "composite_vq", "composite_vn", "composite_qn", "composite_vqn"] %}

{# (name we use, pattern that finds it in any of the three files). The last three need
   patterns because the files spell them differently. #}
{% set flat_fields = [
  ("Student_ID",                    "student_id"),
  ("Secondary_Student_ID",          "secondary_student_id"),
  ("Date_Tested",                   "date_tested"),
  ("Class_Grade",                   "class_grade"),
  ("Battery",                       "battery"),
  ("Level",                         "level"),
  ("Form",                          "form"),
  ("Norm_Year",                     "norm_year"),
  ("Ability_Profile",               "ability_profile*"),
  ("TestInstance_GUID",             "test*instance_guid"),
  ("Mode_of_Administration_String", "mode_of_administration*"),
] %}

{# (score name we output, field name, subtests, characters each subtest gets, column prefix,
   filter to apply). `<prefix>*` finds either the one combined column or the per-subtest ones.
   Note the character counts apply to CSVs too, even though a CSV has no widths of its own:
   we join the per-subtest columns into one string below and then slice it by position, so a
   value longer than its count would push the ones after it out of place. #}
{% set score_fields = [
  ("number_attempted", "Number_Attempted_NA",               raw_tests, 2, "number_attempted_na",               "| int(default=-1)"),
  ("raw_score",        "Raw_Score_RS",                      raw_tests, 2, "raw_score_rs",                      "| int(default=-1)"),
  ("raw_pse",          "Raw_Score_Personal_Standard_Error", raw_tests, 7, "raw_score_personal_standard_error", "| float(default=-1.0)"),
  ("raw_upper",        "Raw_Score_Upper_Bound",             raw_tests, 7, "raw_score_upper_bound",             "| float(default=-1.0)"),
  ("raw_lower",        "Raw_Score_Lower_Bound",             raw_tests, 7, "raw_score_lower_bound",             "| float(default=-1.0)"),
  ("completed",        "Completion_Criteria_CC",            all_tests, 1, "completion_criteria_cc",            ""),
  ("sas_valid",        "SAS_Valid_Flags",                   all_tests, 1, "sas_valid_flags",                   ""),
  ("tmo",              "TMO_Flags",                         all_tests, 1, "tmo_flags",                         ""),
  ("ev",               "Extremely_Variable_Flags",          all_tests, 1, "extremely_variable_flags",          ""),
  ("chance",           "Chance_Flags",                      all_tests, 1, "chance_flags",                      ""),
  ("gs",               "Grade_Stanine_GS",                  all_tests, 1, "grade_stanine_gs",                  ""),
  ("as",               "Age_Stanine_AS",                    all_tests, 1, "age_stanine_as",                    ""),
  ("ls",               "Local_Stanines",                    all_tests, 1, "local_stanines",                    ""),
  ("gpr",              "Grade_Percentile_Rank_GPR",         all_tests, 2, "grade_percentile_rank_gpr",         "| int(default=-1)"),
  ("apr",              "Age_Percentile_Rank_APR",           all_tests, 2, "age_percentile_rank_apr",           "| int(default=-1)"),
  ("lpr",              "Local_Percentile_Rank",             all_tests, 2, "local_percentile_rank",             "| int(default=-1)"),
  ("uss",              "Universal_Scale_Score_USS",         all_tests, 3, "universal_scale_score_uss",         "| int(default=-1)"),
  ("sas",              "Standard_Age_Score_SAS",            all_tests, 3, "standard_age_score_sas",            "| int(default=-1)"),
  ("sas_upper",        "SAS_Upper_Bound",                   all_tests, 6, "sas_upper_bound",                   "| float(default=-1.0)"),
  ("sas_lower",        "SAS_Lower_Bound",                   all_tests, 6, "sas_lower_bound",                   "| float(default=-1.0)"),
] %}

sources:
  input:
    file: ${INPUT_FILE}
  {% if "${INPUT_FILE}".lower().endswith(".txt") %}
    type: fixedwidth
    # the file starts with a byte-order mark; without this the first record shifts a character
    encoding: utf-8-sig
    colspec_file: ./fwf_to_csv_xwalks/cogat_fwf_xwalk.csv
    colspec_headers:
      start: start_index
      end: end_index
      name: column_name
  {% else %}
    type: csv
    header_rows: 1
  {% endif %}
  assessments:
    file: ./seeds/assessments.csv
    header_rows: 1
  assessmentReportingMethodDescriptors:
    file: ./seeds/assessmentReportingMethodDescriptors.csv
    header_rows: 1
  objectiveAssessments:
    file: ./seeds/objectiveAssessments.csv
    header_rows: 1
  performanceLevelDescriptors:
    file: ./seeds/performanceLevelDescriptors.csv
    header_rows: 1
  accommodationDescriptors:
    file: ./seeds/accommodationDescriptors.csv
    header_rows: 1
  gradeLevelDescriptors:
    file: ./seeds/gradeLevelDescriptors.csv
    header_rows: 1
  academicSubjectDescriptors:
    file: ./seeds/academicSubjectDescriptors.csv
    header_rows: 1
  assessmentCategoryDescriptors:
    file: ./seeds/assessmentCategoryDescriptors.csv
    header_rows: 1

transformations:

  gradeLevelDescriptors:
    source: $sources.gradeLevelDescriptors
    operations:
      - operation: rename_columns
        columns:
          edfi_descriptor: gradeDescriptor

  # Okay here's the big normalization where 3 potential inputs become one
  input_normalized:
    source: $sources.input
    operations:
      - operation: snake_case_columns
      # CogAT has room for 30 subtests but only ever reports 7. The per-subtest CSV still
      # ships columns 8-30, so drop them. Matches nothing in the other two files.
      - operation: drop_columns
        columns:
        {% for score, column, tests, width, prefix, cast in score_fields %}
          - "{{prefix}}_[89]"
          - "{{prefix}}_[12][0-9]"
          - "{{prefix}}_30"
        {% endfor %}
      # blank fixed-width fields read as NaN, not "", so make everything a string first.
      - operation: modify_columns
        columns:
        {% for column, pattern in flat_fields %}
          "{{pattern}}": "{%raw%}{{ value if value is string }}{%endraw%}"
        {% endfor %}
        {% for score, column, tests, width, prefix, cast in score_fields %}
          "{{prefix}}*": "{%raw%}{{ (value if value is string else '').rjust({%endraw%}{{width}}{%raw%}) }}{%endraw%}"
        {% endfor %}
      {% for column, pattern in flat_fields %}
      - operation: combine_columns
        columns:
          - "{{pattern}}"
        new_column: {{column}}
        separator: ''
      {% endfor %}
      {% for score, column, tests, width, prefix, cast in score_fields %}
      - operation: combine_columns
        columns:
          - "{{prefix}}*"
        new_column: {{column}}
        separator: ''
      {% endfor %}

  input:
    source: $transformations.input_normalized
    operations: []

  clean_results:
    source: $transformations.input
    operations:
      - operation: keep_columns
        columns:
          - ${STUDENT_ID_NAME}
          {% if '${STUDENT_ID_NAME}' != 'Student_ID' %}
          - Student_ID
          {% elif '${STUDENT_ID_NAME}' != 'Secondary_Student_ID' %}
          - Secondary_Student_ID
          {% endif %}
          - Date_Tested
          - Class_Grade
          - Battery
          - Level
          - Form
          - Norm_Year
          {% for score, column, tests, width, prefix, cast in score_fields %}
          - {{column}}
          {% endfor %}
          - Ability_Profile
          - TestInstance_GUID
          - Mode_of_Administration_String
      - operation: modify_columns
        columns:
          Class_Grade: "{%raw%}{{ value.strip() | int}}{%endraw%}"
      - operation: rename_columns
        columns:
          ${STUDENT_ID_NAME}: studentUniqueID
      - operation: rename_columns
        columns:
          Mode_of_Administration_String: accommodations
      - operation: map_values
        column: Ability_Profile
        mapping:
          "": "N/A"
      - operation: join
        sources:
          - $transformations.gradeLevelDescriptors
        join_type: inner
        left_keys: [Class_Grade]
        right_keys: [cogatGrade]
      - operation: modify_columns
        columns:
          Norm_Year: "{%raw%}20{{value[-2:]}}{%endraw%}"
          Date_Tested: "{%raw%}{{value.rjust(8, '0')}}{%endraw%}"
      - operation: date_format
        column: Date_Tested
        from_format: "%m%d%Y"
        to_format: "%Y-%m-%d"
      - operation: add_columns
        columns:
          school_year: ${API_YEAR}
      # construct a new student assessment identifier in case the GUID is null,
      # e.g. when handling Enrich-sourced files
      - operation: combine_columns
        columns:
          - TestInstance_GUID
          - studentUniqueID
          - Date_Tested
        new_column: studentAssessmentIdentifier
        separator: '-'
      - operation: modify_columns
        columns:
          studentAssessmentIdentifier: "{%raw%}{{ md5(studentAssessmentIdentifier) }}{%endraw%}"

  scored_results:
    source: $transformations.clean_results
    operations:
      # unpack fixed-width sections of individual columns
      - operation: add_columns
        columns:
        {% for score, column, tests, width, prefix, cast in score_fields %}
        {% for test in tests %}
          {{score}}_{{test}}: "{%raw%}{{ {%endraw%}{{column}}[{{width * loop.index0}}:{{width * loop.index0 + width}}] {{cast}}{%raw%} }}{%endraw%}"
        {% endfor %}
        {% endfor %}

  coded_results:
    source: $transformations.scored_results
    operations:
      - operation: add_columns
        columns:
          braile: "{% raw %}{% if accommodations[4] == '1'%}Y{% endif %}{% endraw %}"
          large_print: "{% raw %}{% if accommodations[5] == '1'%}Y{% endif %}{% endraw %}"
          proctor_led: "{% raw %}{% if accommodations[6] == '1'%}Y{% endif %}{% endraw %}"
          self_paced: "{% raw %}{% if accommodations[7] == '1'%}Y{% endif %}{% endraw %}"
          audio_type: "{% raw %}{% if accommodations[8] == '1'%}Y{% endif %}{% endraw %}"
          extended_time: "{% raw %}{% if accommodations[11] == '1'%}Y{% endif %}{% endraw %}"
          alt_v: "{% raw %}{% if accommodations[12] == '1'%}Y{% endif %}{% endraw %}"
      - operation: map_values
        columns:
        {% for test in all_tests %}
          - completed_{{test}}
          - sas_valid_{{test}}
          - tmo_{{test}}
          - ev_{{test}}
          - chance_{{test}}
        {% endfor %}
        mapping:
          "0": "N"
          "1": "Y"
          "": "N"
          " ": "N"
          "  ": "N"
          "   ": "N"
          "    ": "N"
          "     ": "N"
          "      ": "N"
          "       ": "N"

  coded_results_with_identifiers:
    source: $transformations.coded_results
    operations:
      - operation: add_columns
        columns:
          assessmentIdentifier: "{{assessmentIdentifier}}"
          namespace: "{{namespace}}"
          descriptor_namespace: ${DESCRIPTOR_NAMESPACE}
  
  academicSubjectDescriptors:
    source: $sources.academicSubjectDescriptors
    operations:
      - operation: rename_columns
        columns:
          edfi_descriptor: academicSubjectDescriptor
  
  assessmentCategoryDescriptors:
    source: $sources.assessmentCategoryDescriptors
    operations:
      - operation: rename_columns
        columns:
          edfi_descriptor: assessmentCategoryDescriptor

  grade_level_descriptors:
    source: $transformations.gradeLevelDescriptors
    operations:
      - operation: add_columns
        columns:
          grade_json: >
            {%raw-%}  
            {
              "gradeLevelDescriptor": "{{gradeDescriptor}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{grade_json | replace('\n', '')-}}{%endraw%}"
      # group and aggregate:
      - operation: group_by
        group_by_columns:
          - assessmentIdentifier
        create_columns: 
          grade_json: agg(grade_json,)
      # there will be a trailing comma, want to get rid of that
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  assessments:
    source: $sources.assessments
    operations:
      - operation: join
        sources:
          - $transformations.grade_level_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: join
        sources:
          - $transformations.academicSubjectDescriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: join
        sources:
          - $transformations.assessmentCategoryDescriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: add_columns
        columns:
          descriptor_namespace: ${DESCRIPTOR_NAMESPACE}

  objectiveAssessments:
    source: $sources.objectiveAssessments
    operations:
      - operation: add_columns
        columns:
          descriptor_namespace: ${DESCRIPTOR_NAMESPACE}

destinations:
  assessments:
    source: $transformations.assessments
    template: ./templates/assessments.jsont
    extension: jsonl
  assessmentReportingMethodDescriptors:
    source: $sources.assessmentReportingMethodDescriptors
    template: ./templates/assessmentReportingMethodDescriptors.jsont
    extension: jsonl
  performanceLevelDescriptors:
    source: $sources.performanceLevelDescriptors
    template: ./templates/performanceLevelDescriptors.jsont
    extension: jsonl
  objectiveAssessments:
    source: $transformations.objectiveAssessments
    template: ./templates/objectiveAssessments.jsont
    extension: jsonl
  studentAssessments:
    source: $transformations.coded_results_with_identifiers
    template: ./templates/studentAssessments.jsont
    extension: jsonl
  accommodationDescriptors:
    source: $sources.accommodationDescriptors
    template: ./templates/accommodationDescriptors.jsont
    extension: jsonl
