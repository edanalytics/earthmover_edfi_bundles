version: 2


config:
  log_level: INFO
  output_dir: ${OUTPUT_DIR}
  memory_limit: 1GB
  state_file: ${STATE_FILE}
  show_graph: False
  show_stacktrace: true
  parameter_defaults:
    STUDENT_ID_NAME: 'edFi_studentUniqueID' # default to the column added by the apply_xwalk package of student ID xwalking feature
    POSSIBLE_STUDENT_ID_COLUMNS: 'Student_ID,Secondary_Student_ID'
    # need to conform the various inputs we accept first
    EARTHMOVER_NODE_TO_XWALK: '$transformations.input_normalized'
    DESCRIPTOR_NAMESPACE: uri://ed-fi.org 
{% set assessmentIdentifier = "CogAT" %}
{% set namespace = "uri://www.riversideinsights.com/cognitive_abilities_test" %}

{#
  This bundle takes two files:

    * the vendor's fixed-width export (.txt), which is the canonical file
    * input_student_id_no_match.csv, which this bundle writes when it can't match a student
      to Ed-Fi. Users fix the IDs and resubmit it.

  Both use the same column names -- `fwf_to_csv_xwalks/cogat_fwf_xwalk.csv` names the
  fixed-width fields, and the CSV is our own file written with those names -- so there is
  nothing to rename or detect.

  Each score covers seven subtests (V, Q, N, V+Q, V+N, Q+N, V+Q+N). The fixed-width file
  packs all seven into one field; the colspec reads each into its own column and we keep them
  that way. That is deliberate: the no-match file is written by the student_ids package
  through a template that applies `|trim` to every value, which would eat the leading space
  off a packed field and shift every score behind it. One value per column survives that.
#}
{% set raw_tests = ["verbal", "quantitative", "nonverbal"] %}
{% set all_tests = ["verbal", "quantitative", "nonverbal", "composite_vq", "composite_vn", "composite_qn", "composite_vqn"] %}

{# (position in the mode-of-administration flags, name the templates use for it).

   Riverside's layout gives this field 20 single-character flags, 1 = marked and 0 or BLANK =
   omitted. Because an omitted flag may be blank, the colspec reads each position into its own
   `Mode_of_Administration__NN` column: read as one field, a blank flag would be trimmed away
   and every flag after it would shift a position.

   Column NN is 0-based, so it is one less than the position number in Riverside's document:

     00  Online desktop or laptop        10  Spanish Language Administration
     01  Online tablet                   11  Extended Time                *
     02  reserved                        12  Alternative Verbal Reporting *
     03  reserved                        13  reserved
     04  Braille                      *  14  reserved
     05  Large Print                  *  15  reserved
     06  Proctor led                  *  16  reserved
     07  Self-paced                   *  17  reserved
     08  Audio Type                   *  18  reserved
     09  English Language Administration 19  reserved

   * = reported as an Ed-Fi accommodation below. The rest are read but not reported: 00 and 01
   describe delivery mode rather than an accommodation, and 09/10 record the language the test
   was administered in. #}
{% set accommodation_flags = [
  ("04", "braille"),
  ("05", "large_print"),
  ("06", "proctor_led"),
  ("07", "self_paced"),
  ("08", "audio_type"),
  ("11", "extended_time"),
  ("12", "alt_v"),
] %}

{# (score name we output, field it comes from, subtests reported, filter to apply).
   Per-subtest columns are named `<field>__<subtest>` by the colspec file. #}
{% set score_fields = [
  ("number_attempted", "Number_Attempted_NA",               raw_tests, "| int(default=-1)"),
  ("raw_score",        "Raw_Score_RS",                      raw_tests, "| int(default=-1)"),
  ("raw_pse",          "Raw_Score_Personal_Standard_Error", raw_tests, "| float(default=-1.0)"),
  ("raw_upper",        "Raw_Score_Upper_Bound",             raw_tests, "| float(default=-1.0)"),
  ("raw_lower",        "Raw_Score_Lower_Bound",             raw_tests, "| float(default=-1.0)"),
  ("completed",        "Completion_Criteria_CC",            all_tests, ""),
  ("sas_valid",        "SAS_Valid_Flags",                   all_tests, ""),
  ("tmo",              "TMO_Flags",                         all_tests, ""),
  ("ev",               "Extremely_Variable_Flags",          all_tests, ""),
  ("chance",           "Chance_Flags",                      all_tests, ""),
  ("gs",               "Grade_Stanine_GS",                  all_tests, ""),
  ("as",               "Age_Stanine_AS",                    all_tests, ""),
  ("ls",               "Local_Stanines",                    all_tests, ""),
  ("gpr",              "Grade_Percentile_Rank_GPR",         all_tests, "| int(default=-1)"),
  ("apr",              "Age_Percentile_Rank_APR",           all_tests, "| int(default=-1)"),
  ("lpr",              "Local_Percentile_Rank",             all_tests, "| int(default=-1)"),
  ("uss",              "Universal_Scale_Score_USS",         all_tests, "| int(default=-1)"),
  ("sas",              "Standard_Age_Score_SAS",            all_tests, "| int(default=-1)"),
  ("sas_upper",        "SAS_Upper_Bound",                   all_tests, "| float(default=-1.0)"),
  ("sas_lower",        "SAS_Lower_Bound",                   all_tests, "| float(default=-1.0)"),
] %}

sources:
  input:
    file: ${INPUT_FILE}
  {% if "${INPUT_FILE}".lower().endswith(".txt") %}
    type: fixedwidth
    # the file starts with a byte-order mark; without this the first record shifts a character
    encoding: utf-8-sig
    colspec_file: ./fwf_to_csv_xwalks/cogat_fwf_xwalk.csv
    colspec_headers:
      start: start_index
      end: end_index
      name: column_name
  {% else %}
    type: csv
    header_rows: 1
  {% endif %}
  assessments:
    file: ./seeds/assessments.csv
    header_rows: 1
  assessmentReportingMethodDescriptors:
    file: ./seeds/assessmentReportingMethodDescriptors.csv
    header_rows: 1
  objectiveAssessments:
    file: ./seeds/objectiveAssessments.csv
    header_rows: 1
  performanceLevelDescriptors:
    file: ./seeds/performanceLevelDescriptors.csv
    header_rows: 1
  accommodationDescriptors:
    file: ./seeds/accommodationDescriptors.csv
    header_rows: 1
  gradeLevelDescriptors:
    file: ./seeds/gradeLevelDescriptors.csv
    header_rows: 1
  academicSubjectDescriptors:
    file: ./seeds/academicSubjectDescriptors.csv
    header_rows: 1
  assessmentCategoryDescriptors:
    file: ./seeds/assessmentCategoryDescriptors.csv
    header_rows: 1

transformations:

  gradeLevelDescriptors:
    source: $sources.gradeLevelDescriptors
    operations:
      - operation: rename_columns
        columns:
          edfi_descriptor: gradeDescriptor

  # Everything downstream of here reads the same column names whichever file we were given.
  # This node is also what gets written to input_student_id_no_match.csv, so it keeps the
  # descriptive columns (names, school, class) that someone needs in order to fix an ID.
  input_normalized:
    source: $sources.input
    operations:
      # padding and item-level responses are never read, and dropping them keeps the
      # no-match file to a size a person can open
      - operation: drop_columns
        columns:
          - "Filler*"
          - "Item_Responses*"
      # A blank fixed-width field reads as NaN rather than "". Left alone it would reach the
      # no-match file as the text "nan" and break `combine_columns` downstream.
      - operation: modify_columns
        columns:
          "*": "{%raw%}{{ value if value is string }}{%endraw%}"

  input:
    source: $transformations.input_normalized
    operations: []

  clean_results:
    source: $transformations.input
    operations:
      - operation: keep_columns
        columns:
          - ${STUDENT_ID_NAME}
          {% if '${STUDENT_ID_NAME}' != 'Student_ID' %}
          - Student_ID
          {% elif '${STUDENT_ID_NAME}' != 'Secondary_Student_ID' %}
          - Secondary_Student_ID
          {% endif %}
          - Date_Tested
          - Class_Grade
          - Battery
          - Level
          - Form
          - Norm_Year
          {% for score, column, tests, cast in score_fields %}
          {% for test in tests %}
          - {{column}}__{{test}}
          {% endfor %}
          {% endfor %}
          - Ability_Profile
          - TestInstance_GUID
          {% for position, name in accommodation_flags %}
          - Mode_of_Administration__{{position}}
          {% endfor %}
      - operation: modify_columns
        columns:
          Class_Grade: "{%raw%}{{ value.strip() | int}}{%endraw%}"
      - operation: rename_columns
        columns:
          ${STUDENT_ID_NAME}: studentUniqueID
      - operation: map_values
        column: Ability_Profile
        mapping:
          "": "N/A"
      - operation: join
        sources:
          - $transformations.gradeLevelDescriptors
        join_type: inner
        left_keys: [Class_Grade]
        right_keys: [cogatGrade]
      - operation: modify_columns
        columns:
          Norm_Year: "{%raw%}20{{value[-2:]}}{%endraw%}"
          Date_Tested: "{%raw%}{{value.rjust(8, '0')}}{%endraw%}"
      - operation: date_format
        column: Date_Tested
        from_format: "%m%d%Y"
        to_format: "%Y-%m-%d"
      - operation: add_columns
        columns:
          school_year: ${API_YEAR}
      # construct a new student assessment identifier in case the GUID is null,
      # e.g. when handling Enrich-sourced files
      - operation: combine_columns
        columns:
          - TestInstance_GUID
          - studentUniqueID
          - Date_Tested
        new_column: studentAssessmentIdentifier
        separator: '-'
      - operation: modify_columns
        columns:
          studentAssessmentIdentifier: "{%raw%}{{ md5(studentAssessmentIdentifier) }}{%endraw%}"

  scored_results:
    source: $transformations.clean_results
    operations:
      # name each subtest's score the way the templates expect, and cast it. Values are
      # already strings by this point, so a blank one casts to the -1 sentinel.
      - operation: add_columns
        columns:
        {% for score, column, tests, cast in score_fields %}
        {% for test in tests %}
          {{score}}_{{test}}: "{%raw%}{{ {%endraw%}{{column}}__{{test}} {{cast}}{%raw%} }}{%endraw%}"
        {% endfor %}
        {% endfor %}

  coded_results:
    source: $transformations.scored_results
    operations:
      - operation: add_columns
        columns:
        {% for position, name in accommodation_flags %}
          {{name}}: "{%raw%}{% if {%endraw%}Mode_of_Administration__{{position}}{%raw%} == '1' %}Y{% endif %}{%endraw%}"
        {% endfor %}
      - operation: map_values
        columns:
        {% for test in all_tests %}
          - completed_{{test}}
          - sas_valid_{{test}}
          - tmo_{{test}}
          - ev_{{test}}
          - chance_{{test}}
        {% endfor %}
        mapping:
          "0": "N"
          "1": "Y"
          "": "N"
          " ": "N"
          "  ": "N"
          "   ": "N"
          "    ": "N"
          "     ": "N"
          "      ": "N"
          "       ": "N"

  coded_results_with_identifiers:
    source: $transformations.coded_results
    operations:
      - operation: add_columns
        columns:
          assessmentIdentifier: "{{assessmentIdentifier}}"
          namespace: "{{namespace}}"
