display_name: "MAP Growth Assessment"
path: "assessments/MAP_Growth"
valid_edfi: ">=3.0"
report_resources: ["studentAssessments"]
input_files:
  - display_name: "Assessment data"
    env_var: "INPUT_FILE"
    is_required: true
    file_type: ["csv"]
    description: > 
      This file can either be the ComboStudentAssessments or AssessmentResults. If you are using fuzzy matching and wish to automatically match records when possible, you must either submit ComboStudentAssessments alone OR AssessmentResults plus the additional StudentBySchool input file.
  - display_name: "StudentBySchool Input File"
    env_var: "INPUT_FILE_STUDENT_BY_SCHOOL"
    is_required: false
    file_type: ["csv"]
descriptor_mapping_files: ["academicSubjectDescriptors.csv", "assessmentCategoryDescriptors.csv", "gradeLevelDescriptors.csv"]