version: 2


config:
  log_level: INFO
  output_dir: ${OUTPUT_DIR}
  memory_limit: 1GB
  state_file: ${STATE_FILE}
  show_graph: False
  show_stacktrace: true
  parameter_defaults:
    STUDENT_ID_NAME: 'edFi_studentUniqueID' # default to the column added by the apply_xwalk package of student ID xwalking feature
    POSSIBLE_STUDENT_ID_COLUMNS: Student ID, studentId
    DESCRIPTOR_NAMESPACE: uri://ed-fi.org
    EDFI_DS_VERSION: '5'

sources:
  academicSubjectDescriptors:
    file: ./seeds/academicSubjectDescriptors.csv
    header_rows: 1
  assessments:
    file: ./seeds/assessments.csv
    header_rows: 1
  assessmentReportingMethodDescriptors:
    file: ./seeds/assessmentReportingMethodDescriptors.csv
    header_rows: 1
  objectiveAssessments:
    file: ./seeds/objectiveAssessments.csv
    header_rows: 1
  performanceLevelDescriptors:
    file: ./seeds/performanceLevelDescriptors.csv
    header_rows: 1
  gradeLevelDescriptors:
    file: ./seeds/gradeLevelDescriptors.csv
    header_rows: 1
  retestIndicatorDescriptors:
    file: ./seeds/retestIndicatorDescriptors.csv
    header_rows: 1
  assessmentCategoryDescriptors:
    file: ./seeds/assessmentCategoryDescriptors.csv
    header_rows: 1

  input:
    # THIS FILE DOES NOT EXIST; IT MUST BE SUPPLIED BY THE USER!
    file: ${INPUT_FILE}
    header_rows: 1
    # See data/ for sample files.


transformations:
  input:
    source: $sources.input
    operations: []

  clean_results:
    source: $transformations.input
    operations:
      - operation: duplicate_columns
        columns:
          ${STUDENT_ID_NAME}: studentUniqueId
          Date Taken: adminDate
      - operation: snake_case_columns
      - operation: rename_columns
        columns:
          student_unique_id: studentUniqueId
          admin_date: adminDate
          # After snake_case, the reporting-area columns start with a digit
          # (e.g. 1_practices_crosscutting_concepts_in_life_sciences_reporting_area_...),
          # which Jinja cannot reference as a variable. Rename them to short names here.
          # The prefix of each new name (life_sciences, physical_sciences, earth_space_sciences)
          # matches identificationCode in seeds/objectiveAssessments.csv.
          1_practices_crosscutting_concepts_in_life_sciences_reporting_area_percent_points_earned: life_sciences_percent_points_earned
          1_practices_crosscutting_concepts_in_life_sciences_reporting_area_proficiency: life_sciences_proficiency
          2_practices_crosscutting_concepts_in_physical_sciences_reporting_area_percent_points_earned: physical_sciences_percent_points_earned
          2_practices_crosscutting_concepts_in_physical_sciences_reporting_area_proficiency: physical_sciences_proficiency
          3_practices_crosscutting_concepts_in_earth_space_sciences_reporting_area_percent_points_earned: earth_space_sciences_percent_points_earned
          3_practices_crosscutting_concepts_in_earth_space_sciences_reporting_area_proficiency: earth_space_sciences_proficiency
      # Excel stores numeric IDs as numbers, so cast to a string.
      - operation: modify_columns
        columns:
          studentUniqueId: "{%raw%}{{ value }}{%endraw%}"
      - operation: add_columns
        columns:
          # The grade (and retake flag) only appear in the scale-score header, e.g.
          #   grade_5_wcas_summative_scale_score
          #   grade_11_wcas_summative_retake_scale_score
          scale_score_header: "{%raw%}{% for k in __row_data__ if k.startswith('grade_') and k.endswith('_scale_score') %}{{ k }}{% endfor %}{%endraw%}"
          grade: "{%raw%}{{ scale_score_header.split('_')[1] }}{%endraw%}"
          # Unlike SBAC, WCAS retake headers say "(RETAKE)" but do not name the student's grade.
          retest_indicator: "{%raw%}{{ 'True' if '_retake_' in scale_score_header else 'False' }}{%endraw%}"
          # Grade the student was in when tested. For first attempts, assume the assessment's own grade.
          # For retakes the file does not say, so leave it blank; the template then omits
          # whenAssessedGradeLevelDescriptor rather than guessing.
          enrolled_grade: "{%raw%}{{ grade if retest_indicator == 'False' else '' }}{%endraw%}"
          # "Spring 2025-2026 (Summative)" -> 2026
          schoolYear: "{%raw%}{{ test_reason.split(' ')[1].split('-')[1] }}{%endraw%}"

          scaleScore: "{%raw%}{{ __row_data__[scale_score_header] }}{%endraw%}"
          # Seed codeValues are 1-4. Strip a "Level " prefix so this works whether the file says "Level 3" or "3".
          performanceLevel: "{%raw%}{{ __row_data__[scale_score_header | replace('_scale_score', '_performance')] | string | replace('Level ', '') }}{%endraw%}"

          # WCAS is a single-subject (science) assessment, so the identifier is constant.
          assessmentIdentifier: WCAS

      - operation: drop_columns
        columns:
          - grade_*_scale_score
          - grade_*_performance

      - operation: date_format
        column: adminDate
        from_format: "%m/%d/%Y"
        to_format: "%Y%m%d"

      # studentUniqueId + assessmentIdentifier + adminDate makes a unique studentAssessmentIdentifier.
      - operation: add_columns
        columns:
          studentAssessmentIdentifier: "{%raw%}{{ studentUniqueId }}_{{ assessmentIdentifier }}_{{ adminDate if adminDate is string else '' }}{%endraw%}"

      - operation: date_format
        columns:
          - adminDate
        from_format: "%Y%m%d"
        to_format: "%Y-%m-%d %H:%M:%S.%f"

      - operation: modify_columns
        columns:
          studentAssessmentIdentifier: "{%raw%}{{ md5(studentAssessmentIdentifier) }}{%endraw%}"

      # Take namespace from seeds/assessments.csv so it is defined in exactly one place.
      - operation: join
        sources:
          - $transformations.assessment_namespace
        join_type: left
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier

      # Left join so a grade missing from the seed still reaches the API (and is rejected there) instead of being dropped.
      - operation: join
        sources:
          - $sources.gradeLevelDescriptors
        join_type: left
        left_keys:
          - enrolled_grade
          - assessmentIdentifier
        right_keys:
          - originalGrade
          - assessmentIdentifier

  assessment_namespace:
    source: $sources.assessments
    operations:
      - operation: keep_columns
        columns:
          - assessmentIdentifier
          - namespace

  grade_level_descriptors:
    source: $sources.gradeLevelDescriptors
    operations:
      - operation: add_columns
        columns:
          grade_json: >
            {%raw-%}
            {
              "gradeLevelDescriptor": "{{edfi_descriptor}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{grade_json | replace('\n', '')-}}{%endraw%}"
      - operation: group_by
        group_by_columns:
          - assessmentIdentifier
        create_columns:
          grade_json: agg(grade_json,)
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  academic_subject_descriptors:
    source: $sources.academicSubjectDescriptors
    operations:
      - operation: add_columns
        columns:
          subject_json: >
            {%raw-%}
            {
              "academicSubjectDescriptor": "{{edfi_descriptor}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          subject_json: "{%raw%}{{subject_json | replace('\n', '')-}}{%endraw%}"
      - operation: group_by
        group_by_columns:
          - assessmentIdentifier
        create_columns:
          subject_json: agg(subject_json,)
      - operation: modify_columns
        columns:
          subject_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  assessments:
    source: $sources.assessments
    operations:
      - operation: join
        sources:
          - $transformations.grade_level_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: join
        sources:
          - $transformations.academic_subject_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier

destinations:
  assessments:
    source: $transformations.assessments
    template: ./templates/assessments.jsont
    extension: jsonl
  assessmentReportingMethodDescriptors:
    source: $sources.assessmentReportingMethodDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  performanceLevelDescriptors:
    source: $sources.performanceLevelDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  retestIndicatorDescriptors:
    source: $sources.retestIndicatorDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  assessmentCategoryDescriptors:
    source: $sources.assessmentCategoryDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  objectiveAssessments:
    source: $sources.objectiveAssessments
    template: ./templates/objectiveAssessments.jsont
    extension: jsonl
  studentAssessments:
    source: $transformations.clean_results
    template: ./templates/studentAssessments.jsont
    extension: jsonl
