display_name: "Local Assessment"
path: "assessments/Local_Assessment"
valid_edfi: ">=3.0"
report_resources: ["studentAssessments"]
input_files:
  - display_name: "Assessment data"
    env_var: "INPUT_FILE"
    is_required: true
    file_type: ["csv", "tsv"]
input_params:
  - display_name: "Namespace"
    env_var: "NAMESPACE"
    is_required: true
