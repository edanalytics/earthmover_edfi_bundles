      - operation: combine_columns
        columns:
          - administration_date
          - student_unique_id
          - season
          - form
        new_column: studentAssessmentIdentifier
        separator: '-'
      - operation: modify_columns
        columns:
          studentAssessmentIdentifier: "{%raw%}{{ md5(studentAssessmentIdentifier) }}{%endraw%}"
      - operation: date_format
        column: administration_date
        from_format: "%m/%d/%Y"
        to_format: "%Y-%m-%d"
      - operation: join
        sources:
          - $transformations.grade_xwalk
        join_type: left
        left_key: grade
        right_key: original_grade
        right_keep_columns:
          - edfi_descriptor
      - operation: rename_columns
        columns:
          edfi_descriptor: gradeLevelDescriptor
      - operation: modify_columns
        columns:
          gradeLevelDescriptor: "{%raw%}{%- if value != value -%}{%- else -%}{{value}}{%- endif -%}{%endraw%}"
      - operation: filter_rows
        query: "student_unique_id != ''"
        behavior: include

  grade_level_descriptors:
    source: $sources.gradeLevelDescriptors
    operations:
      - operation: add_columns
        columns:
          grade_json: >
            {%raw-%}
            {
              "gradeLevelDescriptor": "{{edfi_descriptor}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{grade_json | replace('\n', '')-}}{%endraw%}"
      - operation: group_by
        group_by_columns:
          - assessmentIdentifier
        create_columns:
          grade_json: agg(grade_json,)
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  performance_level_descriptors:
    source: $sources.performanceLevelDescriptors
    operations:
      - operation: add_columns
        columns:
          performance_level_json: >
            {%raw-%}
            {
              "assessmentReportingMethodDescriptor": "uri://fastbridge.org/assessment/AssessmentReportingMethodDescriptor#Risk Level",
              "performanceLevelDescriptor": "{{namespace}}#{{codeValue}}",
              "resultDatatypeTypeDescriptor": "${DESCRIPTOR_NAMESPACE}/ResultDatatypeTypeDescriptor#Level"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          performance_level_json: "{%raw%}{{performance_level_json | replace('\n', '')-}}{%endraw%}"
      - operation: group_by
        group_by_columns:
          - assessmentIdentifier
        create_columns:
          performance_level_json: agg(performance_level_json,)
      - operation: modify_columns
        columns:
          performance_level_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  assessment_period_descriptors:
    source: $sources.assessmentPeriodDescriptors
    operations:
      - operation: add_columns
        columns:
          period_json: >
            {%raw-%}
            {
              "assessmentPeriodDescriptor": "{{namespace}}#{{codeValue}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          period_json: "{%raw%}{{period_json | replace('\n', '')-}}{%endraw%}"
      - operation: group_by
        group_by_columns:
          - assessmentIdentifier
        create_columns:
          period_json: agg(period_json,)
      - operation: modify_columns
        columns:
          period_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  objective_assessment_scores:
    source: $sources.objectiveAssessmentScores
    operations:
      - operation: add_columns
        columns:
          score_json: >
            {%raw-%}
            {
              "assessmentReportingMethodDescriptor": "uri://fastbridge.org/assessment/AssessmentReportingMethodDescriptor#{{scoreType}}",
              "resultDatatypeTypeDescriptor": "${DESCRIPTOR_NAMESPACE}/ResultDatatypeTypeDescriptor#{{resultDatatype}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          score_json: "{%raw%}{{score_json | replace('\n', '')-}}{%endraw%}"
      - operation: group_by
        group_by_columns:
          - identificationCode
        create_columns:
          score_json: agg(score_json,)
      - operation: modify_columns
        columns:
          score_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  assessment_category_descriptors:
    source: $sources.assessmentCategoryDescriptors
    operations:
      - operation: add_columns
        columns:
          assessmentCategoryDescriptor: "{%raw%}{{namespace}}#{{codeValue}}{%endraw%}"
      - operation: keep_columns
        columns:
          - assessmentIdentifier
          - assessmentCategoryDescriptor

  assessments:
    source: $sources.assessments
    operations:
      - operation: join
        sources:
          - $transformations.grade_level_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: join
        sources:
          - $transformations.performance_level_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: join
        sources:
          - $transformations.assessment_period_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: join
        sources:
          - $sources.academicSubjectDescriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: rename_columns
        columns:
          edfi_descriptor: academicSubjectDescriptor
      - operation: join
        sources:
          - $transformations.assessment_category_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: add_columns
        columns:
          descriptor_namespace: ${DESCRIPTOR_NAMESPACE}

  objective_assessments:
    source: $sources.objectiveAssessments
    operations:
      - operation: join
        sources:
          - $transformations.performance_level_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: join
        sources:
          - $transformations.objective_assessment_scores
        join_type: inner
        left_key: identificationCode
        right_key: identificationCode
      - operation: join
        sources:
          - $sources.academicSubjectDescriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: rename_columns
        columns:
          edfi_descriptor: academicSubjectDescriptor

destinations:
  assessments:
    source: $transformations.assessments
    template: ./templates/assessments.jsont
    extension: jsonl
  objectiveAssessments:
    source: $transformations.objective_assessments
    template: ./templates/objectiveAssessments.jsont
    extension: jsonl
  studentAssessments:
    source: $transformations.cleaned_input
    template: ./templates/studentAssessments.jsont
    extension: jsonl
  assessmentCategoryDescriptors:
    source: $sources.assessmentCategoryDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
    linearize: True
  assessmentReportingMethodDescriptors:
    source: $sources.assessmentReportingMethodDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
    linearize: True
  assessmentPeriodDescriptors:
    source: $sources.assessmentPeriodDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
    linearize: True
  performanceLevelDescriptors:
    source: $sources.performanceLevelDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
    linearize: True
