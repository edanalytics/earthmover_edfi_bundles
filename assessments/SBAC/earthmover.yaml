version: 2


config:
  log_level: INFO
  output_dir: ${OUTPUT_DIR}
  memory_limit: 1GB
  state_file: ${STATE_FILE}
  show_graph: False
  show_stacktrace: true
  parameter_defaults:
    STUDENT_ID_NAME: student_id
    POSSIBLE_STUDENT_ID_COLUMNS: Student ID, studentId
    DESCRIPTOR_NAMESPACE: uri://ed-fi.org
    EDFI_DS_VERSION: '5'

sources:
  assessments:
    file: ./seeds/assessments.csv
    header_rows: 1
  assessmentReportingMethodDescriptors:
    file: ./seeds/assessmentReportingMethodDescriptors.csv
    header_rows: 1
  objectiveAssessments:
    file: ./seeds/objectiveAssessments.csv
    header_rows: 1
  performanceLevelDescriptors:
    file: ./seeds/performanceLevelDescriptors.csv
    header_rows: 1
  gradeLevelDescriptors:
    file: ./seeds/gradeLevelDescriptors.csv
    header_rows: 1
  retestIndicatorDescriptors:
    file: ./seeds/retestIndicatorDescriptors.csv
    header_rows: 1
  assessmentCategoryDescriptors:
    file: ./seeds/assessmentCategoryDescriptors.csv
    header_rows: 1

  input:
    # THIS FILE DOES NOT EXIST; IT MUST BE SUPPLIED BY THE USER!
    file: ${INPUT_FILE}
    header_rows: 1
    # See the accompanying bundle_metadata.json for a list of required columns for this file
    # Or see data/sample_anonymized_file.csv



transformations:
  input:
    source: $sources.input
    operations: []

  clean_results:
    source: $transformations.input
    operations:
      - operation: snake_case_columns
      - operation: duplicate_columns
        columns: 
          ${STUDENT_ID_NAME}: studentUniqueId
          date_taken: adminDate
      # Excel stores numeric IDs as numbers, so cast to a string before combine_columns joins it.
      - operation: modify_columns
        columns:
          studentUniqueId: "{%raw%}{{ value }}{%endraw%}"
      - operation: add_columns
        columns:
          # The academic subject can only be found in the Summative Scale Score Header (e.g. "Grade 6 ELA Summative Scale Score")
          # so here we create a column, scale_score_header, that contains the name of the column that ends with "Summative Scale Score". 
          scale_score_header: "{%raw%}{% for k in __row_data__ if k.startswith('grade_') and k.endswith('_scale_score') %}{{ k }}{% endfor %}{%endraw%}"
          # Then we can extract the academic subject from that column name by removing the "Summative Scale Score" part.
          academic_subject: "{%raw%}{{ scale_score_header.split('_')[2] }}{%endraw%}"
          # Same with grade.
          grade: "{%raw%}{{ scale_score_header.split('_')[1] }}{%endraw%}"
          # Guarded so a header without "_summative_" (or no matching header at all) leaves this blank instead of erroring.
          retake_grade: "{%raw%}{% if '_summative_' in scale_score_header %}{% set parts = scale_score_header.split('_summative_')[1].split('_') %}{% if parts[0] == 'grade' %}{{ parts[1] }}{% endif %}{% endif %}{%endraw%}"
          # The header only names a second grade on retakes, so its presence is the retake flag.
          retest_indicator: "{%raw%}{{ 'True' if retake_grade else 'False' }}{%endraw%}"
          # Grade the student was in when tested. On a retake that is the second grade in the header,
          # otherwise assume the student tested in the assessment's own grade.
          enrolled_grade: "{%raw%}{{ retake_grade if retake_grade else grade }}{%endraw%}"
          # Same with school year.
          schoolYear: "{%raw%}{{ test_reason.split(' ')[1].split('-')[1] }}{%endraw%}"
          
          scaleScore: "{%raw%}{{ __row_data__[scale_score_header] }}{%endraw%}"
          performanceLevel: "{%raw%}{{ __row_data__[scale_score_header | replace('_scale_score', '_performance')] }}{%endraw%}"
          
          assessmentIdentifier: "{%raw%}SBAC_{{ academic_subject | upper }}{%endraw%}"
          namespace: "uri://smarterbalanced.org"

      # Drop the original columns that we no longer need.
      - operation: drop_columns
        columns:
          - grade_*_scale_score
          - grade_*_performance

      # Drop rows that can't be loaded: no student, no admin date, or no overall score.
      # This runs before date_format because a blank date becomes null there, and combine_columns errors on nulls.
      - operation: filter_rows
        query: studentUniqueId != '' and adminDate != '' and scaleScore != ''
        behavior: include

      # Use this date format for the studentAssessmentIdentifier, which is a combination of studentUniqueId and admin_date.
      - operation: date_format
        column: adminDate
        from_format: "%m/%d/%Y"
        to_format: "%Y%m%d"

      # Combine studentUniqueId and adminDate to create a unique studentAssessmentIdentifier.
      - operation: combine_columns
        columns:
          - studentUniqueId
          - adminDate
        new_column: studentAssessmentIdentifier
        separator: '_'

      # Clean date formats.
      - operation: date_format
        columns:
          - adminDate
        from_format: "%Y%m%d"
        to_format: "%Y-%m-%d %H:%M:%S.%f"

      # Hash the studentAssessmentIdentifier to anonymize it.
      - operation: modify_columns
        columns:
          studentAssessmentIdentifier: "{%raw%}{{ md5(studentAssessmentIdentifier) }}{%endraw%}" 

      # Join with gradeLevelDescriptors to get the descriptor for the grade the student was in when tested.
      # Rows whose grade is missing from the seed are dropped here.
      - operation: join
        sources:
          - $sources.gradeLevelDescriptors
        join_type: inner
        left_keys:
          - enrolled_grade
          - assessmentIdentifier
        right_keys:
          - originalGrade
          - assessmentIdentifier

  # instead of hardcoding descriptors that typically use ed-fi defaults (like subjects/grades)
  # we list those in a csv and aggregate as a transformation so we never hardcode those in the jsont
  grade_level_descriptors:
    source: $sources.gradeLevelDescriptors
    operations:
      - operation: add_columns
        columns:
          grade_json: >
            {%raw-%}  
            {
              "gradeLevelDescriptor": "{{gradeLevelDescriptor}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{grade_json | replace('\n', '')-}}{%endraw%}"
      # group and aggregate:
      - operation: group_by
        group_by_columns:
          - assessmentIdentifier
        create_columns: 
          grade_json: agg(grade_json,)
      # there will be a trailing comma, want to get rid of that
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"

  assessments:
    source: $sources.assessments
    operations:
      - operation: join
        sources:
          - $transformations.grade_level_descriptors
        join_type: inner
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier

destinations:
  assessments:
    source: $transformations.assessments
    template: ./templates/assessments.jsont
    extension: jsonl
  assessmentReportingMethodDescriptors:
    source: $sources.assessmentReportingMethodDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  performanceLevelDescriptors:
    source: $sources.performanceLevelDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  retestIndicatorDescriptors:
    source: $sources.retestIndicatorDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  assessmentCategoryDescriptors:
    source: $sources.assessmentCategoryDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
  objectiveAssessments:
    source: $sources.objectiveAssessments
    template: ./templates/objectiveAssessments.jsont
    extension: jsonl
  studentAssessments:
    source: $transformations.clean_results
    template: ./templates/studentAssessments.jsont
    extension: jsonl