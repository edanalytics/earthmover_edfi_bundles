version: 2
config:
  log_level: INFO
  output_dir: ${OUTPUT_DIR}
  memory_limit: 1GB
  state_file: ${STATE_FILE}
  show_graph: false
  show_stacktrace: true
  parameter_defaults:
    # You can set these values at the command line or leave the defaults
    OUTPUT_DIR: ./output/
    STATE_FILE: ./tmp/.earthmover/runs.csv
    API_YEAR: ''
    STUDENT_ID_NAME: 'edFi_studentUniqueID' # default to the column added by the apply_xwalk package of student ID xwalking feature
    POSSIBLE_STUDENT_ID_COLUMNS: Student_ID,Secondary_Student_ID,Student ID, Secondary Student ID
    # need to conform the various inputs we accept first
    EARTHMOVER_NODE_TO_XWALK: '$transformations.input_normalized'
    DESCRIPTOR_NAMESPACE: uri://ed-fi.org

sources:
  input:
    file: ${INPUT_FILE}
  {% if "${INPUT_FILE}".lower().endswith(".txt") %}
    type: fixedwidth
    # the file starts with a byte-order mark; without this the first record shifts a character
    encoding: utf-8-sig
    colspec_file: ./fwf_to_csv_xwalks/iowa_fwf_xwalk.csv
    colspec_headers:
      start: start_index
      end: end_index
      name: column_name
  {% else %}
    type: csv
    header_rows: 1
  {% endif %}
  assessmentReportingMethodDescriptors:
    file: ./seeds/assessmentReportingMethodDescriptors.csv
    header_rows: 1
  assessments:
    file: ./seeds/assessments.csv
    header_rows: 1
  assessmentPeriodDescriptors:
    file: ./seeds/assessmentPeriodDescriptors.csv
    header_rows: 1
  appendix_a:
    file: ./seeds/appendix_a_tests.csv
    header_rows: 1
  performanceLevelDescriptors:
    file: ./seeds/performanceLevelDescriptors.csv
    header_rows: 1
  accommodationDescriptors:
    file: ./seeds/accommodationDescriptors.csv
    header_rows: 1
  assessmentCategoryDescriptors:
    file: ./seeds/assessmentCategoryDescriptors.csv
    header_rows: 1
  gradeLevelDescriptors:
    file: ./seeds/gradeLevelDescriptors.csv
    header_rows: 1
  academicSubjectDescriptors:
    file: ./seeds/academicSubjectDescriptors.csv
    header_rows: 1

transformations:
  # Everything downstream of here reads the same column names whichever file we were given.
  # This node is also what gets written to input_student_id_no_match.csv, so it keeps the
  # descriptive columns (names, school, class) that someone needs in order to fix an ID.
  input_normalized:
    source: $sources.input
    operations:
      # rename student id column after x-walk operation
      - operation: rename_columns
        columns:
          ${STUDENT_ID_NAME}: student_unique_id
      # Fillers repeat once per slot, so the reader suffixes them (`Filler CT.1`, `Filler CT-.1`),
      # and those suffixes collide once snake-cased. Drop them before snake_case_columns.
      - operation: drop_columns
        columns:
          - "Filler*"
      - operation: snake_case_columns
      - operation: drop_columns
        columns:
          - "item_responses*"
          - "office_use_*"
          - "test_administrator_use_*"
          - "other_info_field_*"
          - "code_character_string*"
          - "lexile_*"
          - "quantile_*"
          - "*_pct_correct__*"
      # A blank fixed-width field reads as NaN rather than "". Left alone it would reach the
      # no-match file as the text "nan" and break the below operations
      - operation: modify_columns
        columns:
          student_id: "{%raw%}{{ value if value is string }}{%endraw%}"
          secondary_student_id: "{%raw%}{{ value if value is string }}{%endraw%}"
          building_code: "{%raw%}{{ value if value is string }}{%endraw%}"
          class_grade: "{%raw%}{{ value if value is string }}{%endraw%}"
          date_tested: "{%raw%}{{ value if value is string }}{%endraw%}"
          level: "{%raw%}{{ value if value is string }}{%endraw%}"
          norm_year: "{%raw%}{{ value if value is string }}{%endraw%}"

  input:
    source: $transformations.input_normalized
    operations: []

  cleaned_input:
    source: $transformations.input
    operations:
      - operation: modify_columns
        columns:
          level: "{% raw -%}{{ (level | int) | string if level is not none and level|string|trim != '' else '' }}{%- endraw %}"
          norm_year: "{%raw%}20{{value[-2:]}}{%endraw%}"
          class_grade: "{%raw%}{{class_grade|string|trim}}{%endraw%}"
          # a spreadsheet drops the leading zero off a January-through-September date
          date_tested: "{%raw%}{{value.rjust(8, '0')}}{%endraw%}"
      - operation: date_format
        column: date_tested
        from_format: "%m%d%Y"
        to_format: "%Y-%m-%d"
      - operation: add_columns
        columns:
          school_year: "{%raw%}{{ date_tested[:4] | int + 1 if date_tested[5:7] | int >= 7 else date_tested[:4] | int }}{%endraw%}"
          descriptor_namespace_override: ${DESCRIPTOR_NAMESPACE}
      - operation: join
        sources:
          - $sources.gradeLevelDescriptors
        join_type: left
        left_key: class_grade
        right_key: from
      - operation: modify_columns
        columns:
          class_grade: "{%raw%}{{ edfi_descriptor if edfi_descriptor else class_grade }}{%endraw%}"
      - operation: drop_columns
        columns:
          - from
          - edfi_descriptor
      - operation: map_values
        column: semester
        mapping:
          "1": Fall
          "2": MidYear
          "3": Spring


  appendix_a:
    source: $sources.appendix_a
    operations:
      - operation: add_columns
        columns:
          join_key: "1"

  stage_grade_level:
    source: $sources.gradeLevelDescriptors
    operations:
      - operation: add_columns
        columns:
          joinKey: "Key"
      - operation: rename_columns
        columns:
          edfi_descriptor: Grade_Descriptor

  reporting_methods_base:
    source: $sources.assessmentReportingMethodDescriptors
    operations:
      - operation: filter_rows
        query: isComposite == "0" or isComposite == 0
        behavior: include
      - operation: add_columns
        columns:
          joinKey: "Key"
      - operation: keep_columns
        columns:
          - isComposite
          - codeValue
          - description
          - namespace
          - shortDescription
          - datatype
          - joinKey

# To join with base scores
  extract_reporting_methods_composites:
    source: $sources.assessmentReportingMethodDescriptors
    operations:
      - operation: filter_rows
        query: (isComposite == "1" or isComposite == 1) and (codeValue not in ["Battery","Level","Form","Norm Year"])
        behavior: include
      - operation: add_columns
        columns:
          joinKey: "Key"
      - operation: rename_columns
        columns:
          "codeValue": "codeValueComposite"
          "description": "descriptionComposite"
          "shortDescription": "shortDescriptionComposite"
          "isComposite": "isCompositeComposite"
          "datatype": "datatypeComposite"
      - operation: keep_columns
        columns:
          - isCompositeComposite
          - codeValueComposite
          - descriptionComposite
          - shortDescriptionComposite
          - datatypeComposite
          - joinKey

  reporting_methods_composites:
    source: $transformations.reporting_methods_base
    operations:
      - operation: filter_rows
        query: codeValue in ["Completion Criteria"]
        behavior: exclude
      - operation: join
        sources:
          - $transformations.extract_reporting_methods_composites
        join_type: inner
        left_key: joinKey
        right_key: joinKey
      - operation: add_columns
        columns:
          isComposite: "1"
      - operation: modify_columns
        columns:
          codeValue: "{%raw%}{{ codeValue }}/{{ codeValueComposite }}{%endraw%}"
          shortDescription: "{%raw%}{{ shortDescription }} - {{ shortDescriptionComposite }}{%endraw%}"
          description: "{%raw%}{{ description }} - {{ descriptionComposite }}{%endraw%}"
      - operation: keep_columns
        columns:
          - isComposite
          - codeValue
          - description
          - namespace
          - shortDescription
          - datatype

  reporting_methods_composites2:
    source: $sources.assessmentReportingMethodDescriptors
    operations:
      - operation: filter_rows
        query: (isComposite == "1" or isComposite == 1) and (codeValue in ["Battery","Level","Form","Norm Year"])
        behavior: include
      - operation: add_columns
        columns:
          joinKey: "Key"
      - operation: keep_columns
        columns:
          - isComposite
          - codeValue
          - description
          - namespace
          - shortDescription
          - datatype

  reporting_methods_all:
    source: $transformations.reporting_methods_base
    operations:
      - operation: keep_columns
        columns:
          - codeValue
          - description
          - namespace
          - shortDescription
          - isComposite
          - datatype
      - operation: union
        sources:
          - $transformations.reporting_methods_composites
      - operation: union
        sources:
          - $transformations.reporting_methods_composites2
          

  performance_levels:
    source: $sources.performanceLevelDescriptors
    operations:
      - operation: add_columns
        columns:
          join_key: "1"
          performance_json: >
              {%raw-%} {%- if codeValue is not none and codeValue | length -%} 
              {
                 "assessmentReportingMethodDescriptor": "{{reportingMethod}}",
                 "performanceLevelDescriptor": "{{namespace}}#{{codeValue}}"
              }
              {%-endif-%}
              {%-endraw%}
      - operation: modify_columns
        columns:
          performance_json: "{%raw%}{{performance_json | replace('\n', '')-}}{%endraw%}"
      - operation: group_by
        group_by_columns:
          - join_key
        create_columns: 
          performance_json: agg(performance_json,,)

  period_descriptors:
    source: $sources.assessmentPeriodDescriptors
    operations:
      - operation: add_columns
        columns:
          join_key: "1"
          period_json: >
              {%raw-%}  
              {
                "assessmentPeriodDescriptor": "{{namespace}}#{{codeValue}}"
              }
              {%-endraw%}
      - operation: modify_columns
        columns:
          period_json: "{%raw%}{{period_json | replace('\n', '')}}{%endraw%}"
      - operation: group_by
        group_by_columns:
          - join_key
        create_columns: 
          period_json: agg(period_json,,)
      - operation: keep_columns
        columns:
          - join_key
          - period_json

  grades_json:
    source: $transformations.stage_grade_level 
    operations:
      - operation: keep_columns
        columns:
          - Grade_Descriptor
      - operation: distinct_rows
      - operation: add_columns
        columns:
          join_key: "1"
          grade_json: >
            {%raw-%}
            {
              "gradeLevelDescriptor": "{{Grade_Descriptor}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{grade_json | replace('\n', '')-}}{%endraw%}"
      # group and aggregate:
      - operation: group_by
        group_by_columns:
          - join_key
        create_columns:
          grade_json: agg(grade_json,)
      # there will be a trailing comma, want to get rid of that
      - operation: modify_columns
        columns:
          grade_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"
      - operation: keep_columns
        columns:
          - join_key
          - grade_json

  scores_json:
    source: $transformations.reporting_methods_all
    operations:
      - operation: filter_rows
        query: isComposite=="1"
        behavior: include
      - operation: add_columns
        columns:
          join_key: "1"
          assessmentReportingMethodDescriptor: "{%raw%}{{namespace}}#{{codeValue}}{%endraw%}"
          resultDatatypeTypeDescriptor: "{%raw%}${DESCRIPTOR_NAMESPACE}/ResultDatatypeTypeDescriptor#{{datatype}}{%endraw%}"
      - operation: add_columns
        columns:
          scores_json: >
            {%raw-%}
            {
              "assessmentReportingMethodDescriptor": "{{assessmentReportingMethodDescriptor}}",
              "resultDatatypeTypeDescriptor": "{{resultDatatypeTypeDescriptor}}"
            },
            {%-endraw%}
      - operation: modify_columns
        columns:
          scores_json: "{%raw%}{{scores_json | replace('\n', '')-}}{%endraw%}"
      # group and aggregate:
      - operation: group_by
        group_by_columns:
          - join_key
        create_columns:
          scores_json: agg(scores_json,)
      # there will be a trailing comma, want to get rid of that
      - operation: modify_columns
        columns:
          scores_json: "{%raw%}{{value.rstrip().rstrip(',')}}{%endraw%}"
      - operation: keep_columns
        columns: 
          - join_key
          - scores_json
  
  assessments_source_modified:
    source: $sources.assessments
    operations:
      - operation: add_columns
        columns:
          join_key: "1"
          descriptor_namespace_override: ${DESCRIPTOR_NAMESPACE}
      - operation: join
        sources:
          - $sources.academicSubjectDescriptors
        join_type: left
        left_key: assessmentIdentifier
        right_key: assessmentIdentifier
      - operation: rename_columns
        columns:
          edfi_descriptor: academicSubjectDescriptor
      
  assessments:
    source: $transformations.assessments_source_modified
    operations:
      - operation: keep_columns
        columns:
          - assessmentIdentifier
          - namespace
          - assessmentFamily
          - assessmentTitle
          - assessmentCategoryDescriptor
          - academicSubjectDescriptor
          - join_key
          - descriptor_namespace_override
      - operation: distinct_rows 
      - operation: join
        sources: 
          - $transformations.scores_json
        join_type: outer
        left_key: join_key
        right_key: join_key
      - operation: join
        sources: 
          - $transformations.grades_json
        join_type: inner
        left_keys: 
          - join_key
        right_keys: 
          - join_key
      - operation: join
        sources: 
          - $transformations.period_descriptors
        join_type: inner
        left_keys: 
          - join_key
        right_keys: 
          - join_key
  
  objectiveAssessments:
    source: $transformations.assessments_source_modified
    operations:
      - operation: keep_columns
        columns:
          - assessmentIdentifier
          - namespace
          - academicSubjectDescriptor
          - Level
          - join_key
          - descriptor_namespace_override      
      - operation: join
        sources:
          - $transformations.appendix_a
        join_type: outer
        left_key: join_key
        right_key: join_key
    # Cleanup level-slot combination as per appendix A.
    {% for i in range(5,19) %}
      {% if i > 8 %}
      - operation: filter_rows
        query: 'test_slot == "6" & Level == "{{i}}" & identificationCode == "L"'
        behavior: exclude
      {% endif %}
      {% if i < 9 or i > 17 %}
      - operation: filter_rows
        query: 'test_slot == "6" & Level == "{{i}}" & identificationCode == "WE"' 
        behavior: exclude
      {% endif %}
      {% if i != 6 %}
      - operation: filter_rows
        query: 'test_slot == "25" & Level == "{{i}}"'
        behavior: exclude
      {% endif %}
      {% if i != 6 %}
      - operation: filter_rows
        query: 'test_slot == "26" & Level == "{{i}}"'
        behavior: exclude
      {% endif %}
    {% endfor %}
      #Exclude the overall scores from objective list
      - operation: filter_rows
        query: 'test_slot == "15" or test_slot == "16" or test_slot == "17" or test_slot == "18" or test_slot == "21" or test_slot == "22" or test_slot == "23" or test_slot == "24" '
        behavior: exclude
      - operation: add_columns
        columns:
          rowsOrder: 1
      - operation: join
        sources: 
          - $transformations.performance_levels
        join_type: inner
        left_keys: 
          - join_key
        right_keys: 
          - join_key
      - operation: keep_columns
        columns:
          - assessmentIdentifier
          - namespace
          - academicSubjectDescriptor
          - identificationCode
          - objective_assessment_description
          - rowsOrder
          - join_key
          - descriptor_namespace_override
          - performance_json
      - operation: distinct_rows

  student_assessments:
    source: $transformations.cleaned_input
    operations:
      - operation: join
        sources:
          - $transformations.assessments_source_modified
        join_type: left
        left_keys: 
          - battery
          - form
          - level 
        right_keys: 
          - Battery
          - Form
          - Level
      - operation: add_columns
        columns:
          combined_student_assessment_id: "{%raw%}{{student_unique_id}}-{{district_code}}-{{building_code}}-{{school_year}}-{{assessmentIdentifier}}-{{date_tested}}{%endraw%}" 
          student_assessment_identifier: "{%raw%}{{ md5(combined_student_assessment_id) }}{%endraw%}"
          descriptor_namespace_override: ${DESCRIPTOR_NAMESPACE}
          # Information regarding Form and Level for the assessment
          serial_number: "{%raw%}Form_{{form}}-Level_{{level}}{%endraw%}"
      # filter out rows with missing student IDs
      # - operation: filter_rows
      #   query: "student_unique_id  != ''"
      #   behavior: include

  prepare_student_assessment_valid_school:
    source: $transformations.student_assessments
    operations:
      - operation: modify_columns
        columns:
          building_code: "{% raw -%}{{ (building_code | int) | string if building_code is not none and building_code|string|trim != '' else '' }}{%- endraw %}"
      - operation: filter_rows
        query: building_code != "" and building_code != None
        behavior: include

destinations:
  assessments:
    source: $transformations.assessments
    template: ./templates/assessments.jsont
    extension: jsonl
    linearize: True
  objectiveAssessments:
    source: $transformations.objectiveAssessments
    template: ./templates/objectiveAssessments.jsont
    extension: jsonl
    linearize: True
  studentAssessments:
    source: $transformations.student_assessments
    template: ./templates/studentAssessments.jsont
    extension: jsonl
    linearize: True
  studentAssessmentEducationOrganizationAssociations:
    source: $transformations.prepare_student_assessment_valid_school
    template: ./templates/studentAssessmentEducationOrganizationAssociations.jsont
    extension: jsonl
  assessmentCategoryDescriptors:
    source: $sources.assessmentCategoryDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
    linearize: True
  assessmentReportingMethodDescriptors:
    source: $transformations.reporting_methods_all
    template: ./templates/descriptors.jsont
    extension: jsonl
    linearize: True
  assessmentPeriodDescriptors:
    source: $sources.assessmentPeriodDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
    linearize: True
  performanceLevelDescriptors:
    source: $sources.performanceLevelDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
    linearize: True
  accommodationDescriptors:
    source: $sources.accommodationDescriptors
    template: ./templates/descriptors.jsont
    extension: jsonl
    linearize: True
